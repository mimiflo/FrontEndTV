# Vérifie que FrontEndTV et son installateur compilent à chaque push (l'APK produit est signé avec une clé jetable :
# pour tester seulement).
name: Compilation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Outils Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;36.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Compilateur C# (pour l'installateur .exe)
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q mono-mcs libmono-system-windows-forms4.0-cil libmono-system-drawing4.0-cil \
            libmono-system-numerics4.0-cil > /dev/null
      - run: bash build.sh
      - run: test -f FrontEndTV-Installateur.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FrontEndTV-test
          path: |
            FrontEndTV.apk
            FrontEndTV-Installateur.exe
