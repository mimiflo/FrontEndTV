# Publie une version : à l'envoi d'un tag « v1.3 » (git tag v1.3 && git push origin v1.3), compile FrontEndTV.apk
# signé avec TA clé et FrontEndTV-Installateur.exe, puis les joint à la Release v1.3. Les TV la trouvent ensuite avec
# Réglages de FrontEndTV → Mise à jour.
#
# Une seule fois : dans GitHub → Settings → Secrets and variables → Actions → New repository secret, ajoute
# FREEMYTV_KEYSTORE = le contenu de freemytv.keystore en base64 (sous Git Bash : base64 -w0 freemytv.keystore).
# Sans la même clé, la TV refuse la mise à jour.
#
# La version publique est compilée avec config.example.properties : aucune clé TMDB ni ville personnelle.
name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name="$(grep -o 'android:versionName="[^"]*"' app/AndroidManifest.xml | cut -d'"' -f2)"
          if [ "$tag" != "$name" ]; then
            echo "::error::Le tag ($GITHUB_REF_NAME) ne correspond pas à versionName ($name) dans app/AndroidManifest.xml : augmente versionCode et versionName, puis refais le tag."
            exit 1
          fi
      - name: Clé de signature
        id: key
        env:
          KEYSTORE: ${{ secrets.FREEMYTV_KEYSTORE }}
        run: |
          # Sans le secret, rien n'est publié ici (la version peut être publiée à la main, déjà signée).
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Pas de secret FREEMYTV_KEYSTORE : rien à publier ici (voir en haut de .github/workflows/release.yml)."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > freemytv.keystore
          cp config.example.properties config.properties
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Outils Android et compilateur C#
        if: steps.key.outputs.ok == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;36.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q mono-mcs libmono-system-windows-forms4.0-cil libmono-system-drawing4.0-cil \
            libmono-system-numerics4.0-cil > /dev/null
      - run: bash build.sh
        if: steps.key.outputs.ok == 'true'
      - name: Release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f freemytv.keystore
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" FrontEndTV.apk FrontEndTV-Installateur.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" FrontEndTV.apk FrontEndTV-Installateur.exe \
              --title "FrontEndTV ${GITHUB_REF_NAME#v}" --generate-notes
          fi
