# Publie une version, toute seule : à chaque envoi sur main, si la version de app/AndroidManifest.xml
# (versionName, ex. 1.3) n'a pas encore de Release « v1.3 », compile FrontEndTV.apk signé avec la clé de FrontEndTV
# (Linux), puis FrontEndTV-Installateur.exe avec le compilateur de Microsoft (Windows), le vérifie (il démarre,
# Windows Defender ne le signale pas) et crée la Release v1.3 avec les deux, et les notes de .github/release-notes.md.
# Les TV la trouvent ensuite avec Réglages de FrontEndTV → Mise à jour. Pour publier : augmenter versionCode et
# versionName, puis pousser sur main.
#
# La clé est le secret FREEMYTV_KEYSTORE (freemytv.keystore en base64 : base64 -w0 freemytv.keystore). Sans la même
# clé, la TV refuse la mise à jour. La version publique est compilée avec config.example.properties : aucune clé TMDB
# ni ville personnelle.
name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Version à publier ?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.FREEMYTV_KEYSTORE }}
        run: |
          name="$(grep -o 'android:versionName="[^"]*"' app/AndroidManifest.xml | cut -d'"' -f2)"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" > /dev/null 2>&1; then
            echo "La Release v$name existe déjà : rien à publier."
          elif [ -z "$KEYSTORE" ]; then
            echo "::warning::Pas de secret FREEMYTV_KEYSTORE : la version $name n'est pas publiée."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: APK signé
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE: ${{ secrets.FREEMYTV_KEYSTORE }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > freemytv.keystore
          cp config.example.properties config.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;36.0.0" "platforms;android-34" > /dev/null
          ANDROID_HOME="$RUNNER_TEMP/sdk" SKIP_EXE=1 bash build.sh
          rm -f freemytv.keystore
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: apk-release
          path: FrontEndTV.apk

  windows:
    needs: apk
    if: needs.apk.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: apk-release
      - run: bash installer/build-exe.sh
        shell: bash
      - name: L'installateur démarre, Windows Defender ne le signale pas
        shell: pwsh
        run: ./installer/check-exe.ps1
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.apk.outputs.tag }}
        run: |
          gh release create "$TAG" FrontEndTV.apk FrontEndTV-Installateur.exe --target "$GITHUB_SHA" \
            --title "FrontEndTV ${TAG#v}" --notes-file .github/release-notes.md
