# Réglages de FrontEndTV. build.sh copie ce fichier en config.properties au premier lancement :
# modifie config.properties (jamais publié sur GitHub) puis relance ./build.sh.
# La clé TMDB, la région et le prénom peuvent aussi être envoyés par FrontEndTV-Installateur.exe, sans recompiler.

# Clé gratuite sur https://www.themoviedb.org/settings/api (le « Jeton d'accès en lecture » ou la « Clé d'API »).
# Sans elle, l'accueil marche quand même, sans les recommandations. Ne la publie jamais.
tmdb_key=

# Ton pays (deux lettres) : décide quels titres sont sur quelles applis de streaming. FR, BE, CH, CA, US…
tmdb_region=FR

# Prénom affiché dans le message d'accueil (« Bonsoir, Florian »). Vide : le message seul.
user_name=

# Ta ville, pour la météo et le coucher du soleil (degrés décimaux). Modifiable aussi sur la TV (Réglages de l'accueil → Ville).
latitude=48.8566
longitude=2.3522
city=

# true retire les dessins animés et les animes des recommandations.
hide_animation=false

# auto (suit la TV), ou une langue de app/assets/i18n (fr, en, es, de…)
language=auto

# true affiche le cours des cryptomonnaies (Binance).
show_crypto=false
currency=EUR

# C, F ou auto
temperature=auto

# true coupe aussi l'Assistant Google (« Ok Google »).
disable_assistant=false

# Services à exclure des recommandations, séparés par des virgules : netflix, prime, disney, max, appletv…
hide_services=

# Mises à jour (Réglages de FrontEndTV → Mise à jour) : le dépôt GitHub dont la dernière « Release » contient
# FrontEndTV.apk. Il doit être public (la TV le lit sans compte).
update_repo=mimiflo/FrontEndTV

# Optionnel : une clé Watchmode gratuite (watchmode.com) ouvre directement la page du titre dans l'appli.
watchmode_key=
